name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # самопроверки модулей и сценарии безопасности: без ключа API и без внешних запросов
      - env:
          DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=  # только для проверок, настоящий ключ не здесь
        run: |
          python app.py --check
          python docx_read.py
          python pdf_read.py
          python images.py
          python rubric.py
          python export.py
          python originality.py
          python source_pdf.py
          python vault.py
          python i18n.py
          python test_security.py
