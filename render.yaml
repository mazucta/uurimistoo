# Развёртывание на Render: starter с диском, иначе база и работы стираются при каждом перезапуске.
services:
  - type: web
    name: uurimistoo
    runtime: python
    plan: starter
    region: frankfurt
    # Claude Code ставится рядом с кодом: через него проверки идут по подписке (токен CLAUDE_CODE_OAUTH_TOKEN)
    buildCommand: pip install -r requirements.txt && node --version && npm install --prefix .cli @anthropic-ai/claude-code@2.1.306
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB
        value: /data/data.db
      - key: DATA_KEY
        sync: false          # ключ шифрования работ (python vault.py --new-key); потерян ключ — работы не прочитать
      - key: AI_PARALLEL
        value: "1"           # 512 МБ на starter: один Claude Code за раз, остальные проверки ждут очереди
      - key: BEHIND_PROXY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: CLAUDE_CLI
        value: /opt/render/project/src/.cli/node_modules/.bin/claude
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false          # токен подписки: claude setup-token на своём компьютере; пусто — Claude Code не используется
      - key: ANTHROPIC_API_KEY
        sync: false          # значение вводится в панели Render при создании, в репозитории его нет
      # Canva: ключи интеграции из Canva Developer Portal задаются в панели Render, здесь только адрес возврата
      # - key: CANVA_REDIRECT
      #   value: https://uurimistoo.onrender.com/canva/callback
      - key: REGISTRATION
        value: "off"         # регистрации нет: входят только учителя ниже
      - key: TEACHER_LOGIN
        sync: false          # логин и пароль задаются в панели Render; учитель заводится сам при каждом запуске
      - key: TEACHER_PASSWORD
        sync: false
      - key: TEACHERS
        sync: false          # ещё учителя, по строке «Имя:логин:пароль»
