# Развёртывание на Render. Free-план: диска нет, база живёт до первого перезапуска.
# Когда пилот пойдёт всерьёз, план меняется на starter и добавляется блок disk с DB=/data/data.db.
services:
  - type: web
    name: uurimistoo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    # Постоянного диска на free-плане нет, база живёт до перезапуска. Для настоящих работ:
    # plan: starter, раскомментировать disk и DB, и данные переживут обновление.
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      # - key: DB
      #   value: /data/data.db
      - key: BEHIND_PROXY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false          # значение вводится в панели Render при создании, в репозитории его нет
      # Canva: ключи интеграции из Canva Developer Portal задаются в панели Render, здесь только адрес возврата
      # - key: CANVA_REDIRECT
      #   value: https://uurimistoo.onrender.com/canva/callback
      - key: REGISTRATION
        value: "off"         # регистрации нет: единственный вход это учитель ниже
      - key: TEACHER_LOGIN
        sync: false          # логин и пароль задаются в панели Render; учитель заводится сам при каждом запуске
      - key: TEACHER_PASSWORD
        sync: false
